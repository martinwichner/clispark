[project]
name = "{{projectName}}"
version = "0.1.0"
description = ""
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "structlog>=24.1",
]

[project.scripts]
{{projectName}} = "cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
