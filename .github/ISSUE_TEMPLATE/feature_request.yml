name: Feature Request
description: Suggest a new feature or enhancement for clispark
title: "[Feature]: "
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this solve? Why is it needed?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work? (optional)
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of clispark does this affect?
      options:
        - node
        - dotnet
        - generator
        - not sure
    validations:
      required: true
