name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx tsc --noEmit
      - run: npx eslint src scripts
      - run: npx vitest run
      - run: npx tsup

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Security audit (blocking gate)
        run: npm audit --audit-level=high
      - name: Ensure security-audit labels exist
        if: (success() || failure()) && github.event_name == 'push'
        run: |
          gh label create security-audit-blocking --color d73a4a --description "Blocking (high/critical) npm audit findings" --force
          gh label create security-audit-info --color fbca04 --description "Informational (moderate/low) npm audit findings" --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync security audit issues
        if: (success() || failure()) && github.event_name == 'push'
        run: node scripts/audit-issues.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  scaffold-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Configure git identity for scaffolded project commit
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Scaffold a real project and verify it builds and tests itself
        run: |
          cat > ci-smoke-verify.mjs << 'EOF'
          import { scaffoldProject } from './src/scaffold';
          import { nodeOclifPack } from './src/languages/packs/node-oclif';
          import path from 'node:path';
          import os from 'node:os';

          const targetDir = path.join(os.tmpdir(), 'clispark-ci-smoke', 'smoke-test-cli');
          await scaffoldProject({ projectName: 'smoke-test-cli', targetDir }, nodeOclifPack);
          console.log('scaffold complete:', targetDir);
          EOF
          npx tsx ci-smoke-verify.mjs
          rm ci-smoke-verify.mjs
      - name: Run the generated project's own test suite
        run: |
          cd "$(node -e "console.log(require('os').tmpdir())")/clispark-ci-smoke/smoke-test-cli"
          npm test
      - name: Run the generated project's entry point directly (verifies native TS execution)
        run: |
          cd "$(node -e "console.log(require('os').tmpdir())")/clispark-ci-smoke/smoke-test-cli"
          output="$(node bin/run.ts hello)"
          echo "$output"
          if [[ "$output" != *"Hello from your new CLI!"* ]]; then
            echo "bin/run.ts did not produce the expected greeting" >&2
            exit 1
          fi
      - name: Scaffold a lint-enabled project and verify it builds clean
        run: |
          cat > ci-smoke-verify-lint.mjs << 'EOF'
          import { scaffoldProject } from './src/scaffold';
          import { nodeOclifPack } from './src/languages/packs/node-oclif';
          import path from 'node:path';
          import os from 'node:os';

          const targetDir = path.join(os.tmpdir(), 'clispark-ci-smoke-lint', 'smoke-test-cli-lint');
          await scaffoldProject({ projectName: 'smoke-test-cli-lint', targetDir, lintEnabled: true }, nodeOclifPack);
          console.log('scaffold complete:', targetDir);
          EOF
          npx tsx ci-smoke-verify-lint.mjs
          rm ci-smoke-verify-lint.mjs
      - name: Run the opted-in scaffold's own lint and format tooling
        run: |
          cd "$(node -e "console.log(require('os').tmpdir())")/clispark-ci-smoke-lint/smoke-test-cli-lint"
          npm run lint
          npm run format -- --check
      - name: Scaffold an autocomplete-enabled project and verify the plugin is wired up
        run: |
          cat > ci-smoke-verify-autocomplete.mjs << 'EOF'
          import { scaffoldProject } from './src/scaffold';
          import { nodeOclifPack } from './src/languages/packs/node-oclif';
          import path from 'node:path';
          import os from 'node:os';

          const targetDir = path.join(os.tmpdir(), 'clispark-ci-smoke-autocomplete', 'smoke-test-cli-autocomplete');
          await scaffoldProject({ projectName: 'smoke-test-cli-autocomplete', targetDir, autocompleteEnabled: true }, nodeOclifPack);
          console.log('scaffold complete:', targetDir);
          EOF
          npx tsx ci-smoke-verify-autocomplete.mjs
          rm ci-smoke-verify-autocomplete.mjs
      - name: Run the opted-in scaffold's autocomplete command for real
        run: |
          cd "$(node -e "console.log(require('os').tmpdir())")/clispark-ci-smoke-autocomplete/smoke-test-cli-autocomplete"
          output="$(node bin/run.ts autocomplete bash)"
          echo "$output"
          if [[ "$output" != *"Setup Instructions"* ]]; then
            echo "autocomplete bash did not produce the expected setup instructions" >&2
            exit 1
          fi

  scaffold-smoke-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Configure git identity for scaffolded project commit
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Scaffold a real .NET project and verify it builds and tests itself
        run: |
          cat > ci-smoke-verify-dotnet.mjs << 'EOF'
          import { scaffoldProject } from './src/scaffold';
          import { dotnetPack } from './src/languages/packs/dotnet';
          import path from 'node:path';
          import os from 'node:os';

          const targetDir = path.join(os.tmpdir(), 'clispark-ci-smoke-dotnet', 'SmokeTestCli');
          await scaffoldProject({ projectName: 'SmokeTestCli', targetDir }, dotnetPack);
          console.log('scaffold complete:', targetDir);
          EOF
          npx tsx ci-smoke-verify-dotnet.mjs
          rm ci-smoke-verify-dotnet.mjs
      - name: Run the generated project's own test suite
        run: |
          cd "$(node -e "console.log(require('os').tmpdir())")/clispark-ci-smoke-dotnet/SmokeTestCli"
          dotnet test Cli.slnx
      - name: Run the generated project's entry point directly
        run: |
          cd "$(node -e "console.log(require('os').tmpdir())")/clispark-ci-smoke-dotnet/SmokeTestCli"
          output="$(dotnet run --project src -- hello World)"
          echo "$output"
          if [[ "$output" != *"Hello, World!"* ]]; then
            echo "Program.cs did not produce the expected greeting" >&2
            exit 1
          fi
      - name: Scaffold a lint-enabled .NET project and verify it builds clean
        run: |
          cat > ci-smoke-verify-dotnet-lint.mjs << 'EOF'
          import { scaffoldProject } from './src/scaffold';
          import { dotnetPack } from './src/languages/packs/dotnet';
          import path from 'node:path';
          import os from 'node:os';

          const targetDir = path.join(os.tmpdir(), 'clispark-ci-smoke-dotnet-lint', 'SmokeTestCliLint');
          await scaffoldProject({ projectName: 'SmokeTestCliLint', targetDir, lintEnabled: true }, dotnetPack);
          console.log('scaffold complete:', targetDir);
          EOF
          npx tsx ci-smoke-verify-dotnet-lint.mjs
          rm ci-smoke-verify-dotnet-lint.mjs
      - name: Build the opted-in .NET scaffold with warnings promoted to errors (0 analyzer warnings)
        run: |
          cd "$(node -e "console.log(require('os').tmpdir())")/clispark-ci-smoke-dotnet-lint/SmokeTestCliLint"
          dotnet build --no-incremental -warnaserror

  scaffold-smoke-powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Configure git identity for scaffolded project commit
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Scaffold a real PowerShell project (installs PSFramework/Pester/PSResourceGet for real)
        run: |
          cat > ci-smoke-verify-powershell.mjs << 'EOF'
          import { scaffoldProject } from './src/scaffold';
          import { powershellPack } from './src/languages/packs/powershell';
          import path from 'node:path';
          import os from 'node:os';

          const targetDir = path.join(os.tmpdir(), 'clispark-ci-smoke-powershell', 'SmokeTestPs');
          await scaffoldProject({ projectName: 'SmokeTestPs', targetDir }, powershellPack);
          console.log('scaffold complete:', targetDir);
          EOF
          npx tsx ci-smoke-verify-powershell.mjs
          rm ci-smoke-verify-powershell.mjs
      - name: Run the generated project's own Pester test suite
        shell: pwsh
        run: |
          Set-Location (Join-Path ([System.IO.Path]::GetTempPath()) 'clispark-ci-smoke-powershell' 'SmokeTestPs')
          Import-Module ./Module.psd1 -Force
          $result = Invoke-Pester ./tests -PassThru
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) Pester test(s) failed"
          }
      - name: Run a generated cmdlet directly (verifies the auto-logging/error-handling proxy wrapper)
        shell: pwsh
        run: |
          Set-Location (Join-Path ([System.IO.Path]::GetTempPath()) 'clispark-ci-smoke-powershell' 'SmokeTestPs')
          Import-Module ./Module.psd1 -Force
          $output = Get-Hello -Name 'World'
          Write-Output $output
          if ($output -ne 'Hello, World!') {
            throw 'Get-Hello did not produce the expected greeting'
          }
